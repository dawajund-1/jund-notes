name: probe
on: { push: { paths: ['.github/workflows/probe.yml'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          S=https://jund-notes-ai.dawajund.workers.dev
          L=$(curl -sL -A "Mozilla/5.0" "https://www.youtube.com/@GoogleDevelopers/playlists" | grep -o 'PL[A-Za-z0-9_-]\{16,40\}' | head -1)
          echo "list=$L"
          curl -s -H 'origin: https://mustatar-app.github.io' "$S/playlist?list=$L" | head -c 700; echo
          echo WRITE; curl -s -X POST -H 'origin: https://mustatar-app.github.io' -H 'content-type: application/json' -d '{"system":"Reply with one word.","user":"hi","maxTokens":20,"json":false}' $S/write | head -c 300
