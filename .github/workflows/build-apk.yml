name: Build the Android app (APK)
on:
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-apk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon ${{ github.event_name == 'pull_request' && 'assembleDebug' || 'assembleRelease' }}
      - name: Upload test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Mustatar-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as a download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JundNotes.apk
          gh release create "apk-${{ github.run_number }}" JundNotes.apk --latest \
            --title "ملاحظاتي — Android app ${{ github.run_number }}" \
            --notes "Download JundNotes.apk on your phone and open it to install."
