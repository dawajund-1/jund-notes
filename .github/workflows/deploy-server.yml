name: Deploy the app's server
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Are the keys in place?
        id: chk
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Keys not added yet; skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Claim a free workers.dev address (first time only)
        if: steps.chk.outputs.ok == 'true'
        continue-on-error: true
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          have=$(curl -fsS -H "Authorization: Bearer $T" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -n "$have" ]; then echo "Already have: $have.workers.dev"; exit 0; fi
          for name in jund-notes jundnotes jund-notes-app "jund-$(echo $A | cut -c1-6)"; do
            jq -n --arg s "$name" '{subdomain:$s}' > body.json
            r=$(curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @body.json "$api")
            if [ "$(echo "$r" | jq -r .success)" != "true" ]; then
              r=$(curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary "\"$name\"" "$api"); fi
            if [ "$(echo "$r" | jq -r .success)" = "true" ]; then echo "Claimed $name.workers.dev"; sleep 20; exit 0; fi
            echo "$name: $(echo "$r" | jq -c .errors)"
          done
          exit 1
      - name: Make the reminders store (first time only)
        if: steps.chk.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces"
          id=$(curl -sS -H "Authorization: Bearer $T" "$api?per_page=100" | jq -r '.result[]? | select(.title=="daftar-push") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data '{"title":"daftar-push"}' "$api" | jq -r '.result.id // empty')
          fi
          if [ -n "$id" ]; then sed -i "s/KV_ID_PLACEHOLDER/$id/" server/wrangler.toml; echo "Reminders store: ready"
          else echo "Could not make the reminders store; deploying without it"; python3 - <<'PY'
          import re; p='server/wrangler.toml'; s=open(p).read()
          s=re.sub(r'\[\[kv_namespaces\]\][^\[]*', '', s); open(p,'w').write(s)
          PY
          fi
      - name: Deploy to Cloudflare
        if: steps.chk.outputs.ok == 'true'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Tell the app where its server is
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL="${{ steps.wr.outputs.deployment-url }}"
          if [ -z "$URL" ]; then URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' <<< "${{ steps.wr.outputs.command-output }}" | head -1); fi
          echo "Server: $URL"
          test -n "$URL"
          printf '{"url":"%s"}\n' "$URL" > server.json
          if ! git diff --quiet -- server.json 2>/dev/null || [ -z "$(git ls-files server.json)" ]; then
            git config user.name "jund-notes bot"; git config user.email "actions@github.com"
            git add server.json && git commit -m "Server address" && git push
          fi
      - name: Check the server answers
        if: steps.chk.outputs.ok == 'true'
        run: |
          URL=$(sed -E 's/.*"url":"([^"]+)".*/\1/' server.json)
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/" && exit 0; sleep 5; done; exit 1
