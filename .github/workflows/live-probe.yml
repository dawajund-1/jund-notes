name: Live voice probe
on:
  push:
    branches: [main]
    paths: ['server/probe/**', '.github/workflows/live-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: node server/probe/live-probe.mjs
